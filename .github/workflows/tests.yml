name: Validar Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: mvn clean compile
    
    - name: Run Tests
      run: mvn test || echo "Tests ejecutados (algunos pueden fallar sin detener el build)"
      
    - name: Notificar resultado
      if: failure()
      run: echo "⚠️ Los tests fallaron. Por favor revisa los errores antes de hacer merge."
